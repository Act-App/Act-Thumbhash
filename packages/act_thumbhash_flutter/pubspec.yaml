name: act_thumbhash_flutter
description: Flutter widgets and image providers for ThumbHash image placeholders. Show instant lossy previews while full images load.

homepage: https://github.com/Act-App/Act-Thumbhash
repository: https://github.com/Act-App/Act-Thumbhash/tree/main/packages/act_thumbhash_flutter
issue_tracker: https://github.com/Act-App/Act-Thumbhash/issues

version: 1.0.0

environment:
  sdk: ^3.6.0
  flutter: '>=3.10.0'
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  act_thumbhash: ^1.0.0

dev_dependencies:
  # flutter_lints 6.x requires Dart ^3.8.0; 5.x matches this package's ^3.6.0.
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter